name: staffix
description: "Ini adalah sistem management SDM"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Versi SDK yang lebih aman untuk Flutter modern

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  geolocator: ^13.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0 # Versi 6.0.0 mungkin belum tersedia/stabil di SDK Anda

flutter:
  uses-material-design: true
